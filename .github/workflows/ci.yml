name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: translogix_db
          MYSQL_USER: translogix_user
          MYSQL_PASSWORD: translogix_pass
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run build and tests
        env:
          DB_URL: jdbc:mysql://localhost:3306/translogix_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USER: translogix_user
          DB_PASSWORD: translogix_pass
        run: ./mvnw -B verify