name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: transivo
          POSTGRES_USER: transivo
          POSTGRES_PASSWORD: transivo_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U transivo"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/transivo
          DB_USER: transivo
          DB_PASSWORD: transivo_dev
