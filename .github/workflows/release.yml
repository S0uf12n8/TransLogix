name: Release

# Pushing a version tag (e.g. v0.3-iteration3) builds the Windows application and attaches the zip to the
# GitHub Release of that tag (the Release is created if it does not exist yet).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # create the Release and upload the zip

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          # v0.3-iteration3 -> 0.3 (jpackage only accepts numbers)
          if ("${{ github.ref_name }}" -notmatch '^v(\d+(\.\d+){0,2})') { throw "Tag sans numéro de version : ${{ github.ref_name }}" }
          "number=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Build and package (tests included; MySQL tests are skipped without DB_URL)
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version ${{ steps.version.outputs.number }}

      - name: Attach the zip to the Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $zip = "target/dist/TransLogix-${{ steps.version.outputs.number }}-windows.zip"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $zip --clobber
          } else {
            gh release create $env:TAG $zip --title $env:TAG --generate-notes --verify-tag
          }
