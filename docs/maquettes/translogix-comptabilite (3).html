<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Comptabilité & Finance | TransLogix ERP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--navy:#0A192F;--or:#f97316;--ord:#ea580c;--ink:#1e293b;--mut:#64748b;--line:#e2e8f0;--bg:#f8fafc}
*{box-sizing:border-box}
body{margin:0;font:13px Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:flex;min-height:100vh}
.sb{background:var(--navy);color:#e2e8f0;width:264px;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.sb nav{flex:1;overflow-y:auto;padding:12px}
.logo{padding:18px;border-bottom:1px solid #ffffff1a;display:flex;gap:12px;align-items:center}
.logo img{width:44px;height:44px;border-radius:11px;box-shadow:0 2px 10px #0008}.dl{width:54px;height:54px;border-radius:12px}.phd{display:none}
.logo b{display:block;color:#fff;font-size:15px}.logo small{font-size:10px;color:#94a3b8}
.eb{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#64748b;padding:14px 12px 6px}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:0;background:none;border-radius:8px;color:#94a3b8;font:500 13px inherit;font-family:inherit;cursor:pointer;text-align:left}
.nv i{width:18px;text-align:center}.nv:hover{background:#1e293b;color:#fff}
.nv.on{background:var(--or);color:#fff;font-weight:600}
.nv em{margin-left:auto;background:#dc2626;color:#fff;border-radius:99px;font-style:normal;font-size:10px;padding:1px 7px}
main{flex:1;min-width:0}
header{box-shadow:0 1px 0 var(--line),0 4px 12px #0f172a08;height:64px;background:#fff;border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
header h2{margin:0;font-size:15px}.eb2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
#view{padding:28px;max-width:1500px;margin:auto;display:grid;gap:20px}
.pn{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px #0000000d}
.p{padding:18px}.ov{overflow-x:auto}.fx{display:flex;justify-content:space-between;align-items:center}.g{gap:8px;flex-wrap:wrap}
h3{margin:0;font-size:14px}.mut{color:var(--mut);font-size:12px;margin:4px 0 0}.c{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.k{padding:18px}.k p{margin:0;color:var(--mut);font-weight:500}.k b{display:block;font-size:22px;margin-top:8px;font-weight:800}.k small{display:block;margin-top:6px;font-size:11px}
.bp,.bs{border-radius:8px;padding:8px 14px;font:600 12px inherit;font-family:inherit;cursor:pointer;border:1px solid transparent}
.bp{background:var(--or);color:#fff}.bp:hover{background:var(--ord)}.bs{background:#fff;border-color:var(--line);color:#334155}.bs:hover{background:#f1f5f9}
.bd{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap}
.ok{background:#dcfce7;color:#15803d}.wa{background:#fef3c7;color:#b45309}.ko{background:#fee2e2;color:#b91c1c}.in{background:#e0f2fe;color:#0369a1}
.tr{color:#dc2626;font-weight:700}.tg{color:#059669;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}
th{background:#f8fafc;color:var(--mut);font-size:11px;text-transform:uppercase;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{font-variant-numeric:tabular-nums;padding:12px 14px;border-bottom:1px solid #f1f5f9;color:#334155}tr:hover td{background:#fafafa}
.al{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px 14px;color:#9a3412;font-size:12px;margin:0 0 6px}
.al.r{background:#fef2f2;border-color:#fecaca;color:#991b1b}
label{display:block;font-size:11px;font-weight:700;color:#334155;margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:12px inherit;font-family:inherit;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--or);box-shadow:0 0 0 3px #fed7aa66}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
#modal{display:none;position:fixed;inset:0;background:#0f172a99;z-index:50;overflow:auto;padding:30px 12px}
#modal.on{display:block}.mb{background:#fff;border-radius:14px;max-width:620px;margin:auto;padding:24px;position:relative}
.mb h3{font-size:16px;margin-bottom:14px}.x{position:absolute;right:14px;top:12px;border:0;background:none;font-size:18px;cursor:pointer;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:22px;height:170px;padding:10px 6px 0}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.bars span{display:inline-block;width:42%;border-radius:4px 4px 0 0;margin:0 1px;vertical-align:bottom}
#toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;font-weight:600;padding:12px 16px;border-radius:8px;z-index:60;display:none;box-shadow:0 8px 24px #0004}
.doc{font-size:12px}.doc table td,.doc table th{padding:8px 10px}.doc .tot{text-align:right;margin-top:10px;line-height:1.8}
@media(max-width:860px){.app{flex-direction:column}.sb{width:100%;height:auto;position:static}.f2{grid-template-columns:1fr}header{height:auto;padding:10px 14px;flex-wrap:wrap;gap:8px}#view{padding:14px}}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}.sb nav::-webkit-scrollbar-thumb{background:#1e293b}
@media print{.phd{display:flex;align-items:center;gap:14px;padding:0 28px 12px;border-bottom:2px solid #0A192F}.phd img{width:48px;height:48px;border-radius:10px}.phd span{margin-left:auto;font-size:11px;color:#64748b}body{background:#fff}.sb,header,.noprint,.x{display:none!important}#modal.on{position:static;background:none;padding:0}.mb{box-shadow:none;max-width:none}.pn{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sb">
  <div class="logo"><img id="lg" alt="TransLogix"><div><b>TransLogix ERP</b><small>FINANCE & COMPTABILITÉ</small></div></div>
  <nav id="nav"></nav>
  <div style="padding:14px;border-top:1px solid #ffffff1a;font-size:11px;color:#64748b">TransLogix </div>
</aside>
<main>
  <header>
    <div><p class="eb2" id="kick" style="margin:0"></p><h2 id="ttl"></h2></div>
    <div class="fx g">
      <button class="bp" onclick="openConv()"><i class="fa-solid fa-plus"></i> Convertir BL en facture</button>
      <button class="bs" onclick="exportCur()"><i class="fa-solid fa-file-excel"></i> Exporter Excel</button>
      <button class="bs" onclick="window.print()"><i class="fa-solid fa-file-pdf"></i> PDF / Imprimer</button>
    </div>
  </header>
  <div class="phd"><img id="lg2" alt=""><div><b id="pco"></b><br><span id="pti" style="margin:0"></span></div><span id="pdt"></span></div>
  <div id="view"></div>
</main>
</div>
<div id="modal"></div><div id="toast"></div>

/* ========== Utilitaires ========== */
const $=s=>document.querySelector(s),TODAY=new Date(),iso=d=>d.toISOString().slice(0,10);
const addD=(n,b=new Date())=>{const d=new Date(b);d.setDate(d.getDate()+n);return iso(d)};
const fr=d=>d.split('-').reverse().join('/'),r2=n=>Math.round(n*100)/100;
const M=n=>(+n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' MAD';
const days=d=>Math.floor((TODAY-new Date(d))/864e5),MK=iso(TODAY).slice(0,7);
const b=(c,t)=>`<span class="bd ${c}">${t}</span>`;
const btn=(t,f,c='bp')=>`<button class="${c}" onclick="${f}">${t}</button>`;
const tbl=(h,r)=>`<div class="pn ov"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.length?r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="c mut" style="padding:24px">Aucune donnée</td></tr>`}</tbody></table></div>`;
const head=(t,s,x='')=>`<div class="pn p fx"><div><h3>${t}</h3><p class="mut">${s}</p></div><div class="fx g">${x}</div></div>`;
const inp=(l,n,t='text',v='',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${v}" ${x}></label>`;
const sel=(l,n,o,v='')=>`<label>${l}<select name="${n}">${o.map(([a,c])=>`<option value="${a}" ${a==v?'selected':''}>${c}</option>`).join('')}</select></label>`;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
function modal(h){$('#modal').innerHTML=`<div class="mb"><button class="x" onclick="closeM()" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>${h}</div>`;$('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on')}
function csv(name,rows){const t='\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/<[^>]+>/g,'').replace(/"/g,'""')}"`).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name+'_'+iso(TODAY)+'.csv';a.click();toast('Export Excel (CSV) généré : '+name)}

/* ========== Données & persistance ========== */
const KEY='translogix_compta_v3';let S,cur='dashboard';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const ACC={3421:'Clients',3455:'État - TVA récupérable',4411:'Fournisseurs',4432:'Rémunérations dues',4441:'CNSS / AMO',4452:'État - IR retenu',4455:'État - TVA facturée',5141:'Banque',5161:'Caisse',1111:'Capital social',6122:'Achats consommables (carburant)',6133:'Entretien & réparations',6134:'Primes d’assurances',6143:'Déplacements & frais de route',6167:'Impôts & taxes (vignette)',6171:'Rémunérations du personnel',7121:'Ventes de services (transport)'};
const CAT={carburant:['Carburant flotte','6122',10],maintenance:['Pièces & maintenance','6133',20],assurance:['Assurance','6134',0],taxes:['Vignette & taxes','6167',0],autre:['Autres achats','6122',20]};
const MODES={forfait:'Contrat (forfait)',poids:'Poids (tonnes)',distance:'Distance (km)'};
function post(date,j,ref,label,lines){S.jr.push({date,j,ref,label,lines})}

/* Facturation */
const paidOf=i=>i.pays.reduce((s,p)=>s+p.amt,0),rest=i=>r2(i.ttc-paidOf(i)),late=i=>rest(i)>.004&&i.due<iso(TODAY);
const stI=i=>rest(i)<=.004?b('ok','Payée'):late(i)?b('ko','En retard ('+days(i.due)+' j)'):paidOf(i)>0?b('wa','Partielle'):b('wa','En attente');
function calc(bl,mode,rate){const c=S.clients.find(x=>x.name===bl.client);const ht=r2(mode==='forfait'?c.forfait:mode==='poids'?bl.t*c.tonne:bl.km*c.km),tva=r2(ht*rate/100);return{ht,tva,ttc:r2(ht+tva)}}
function makeInv(id,mode,rate,date){const bl=S.bls.find(x=>x.id===id),c=S.clients.find(x=>x.name===bl.client),k=calc(bl,mode,rate);
 const no=`FAC-${date.slice(0,4)}-${String(++S.n.inv).padStart(3,'0')}`;
 S.invs.push({no,bl:id,client:bl.client,date,due:addD(c.terms,new Date(date)),mode,rate,...k,pays:[]});bl.inv=no;
 post(date,'VT',no,`Facture ${no} - ${bl.client}`,[['3421',k.ttc,0],['7121',0,k.ht],['4455',0,k.tva]]);return no}
function payInv(no,amt,mode,date){const i=S.invs.find(x=>x.no===no),cash=mode==='Espèces';i.pays.push({date,amt,mode});
 post(date,cash?'CA':'BQ',no,`Encaissement ${no} (${mode})`,[[cash?'5161':'5141',amt,0],['3421',0,amt]])}
/* Fournisseurs */
function addSinv({sup,ref,cat,date,ttc,due,rate}){const ht=r2(ttc/(1+rate/100)),tva=r2(ttc-ht),s={id:++S.n.si,sup,ref,cat,date,due,ttc,rate,ht,tva,pays:[]};S.sinv.push(s);
 post(date,'AC',ref,`Facture ${sup}`,[[CAT[cat][1],ht,0],...(tva?[['3455',tva,0]]:[]),['4411',0,ttc]]);return s}
function paySinv(id,amt,mode,date,ref){const s=S.sinv.find(x=>x.id==id),cash=mode==='Espèces';s.pays.push({date,amt,mode,ref,no:'REG-'+(++S.n.reg)});

['Facturation & Ventes',[['invoices','Facturation (TVA)','file-invoice-dollar','Facturation & Ventes','Conversion des bons de livraison en factures'],['receivables','Recouvrement B2B','hand-holding-dollar','Recouvrement B2B','Créances, échéances et relances']]],
['Fournisseurs',[['sdebt','Dettes fournisseurs','file-invoice','Dettes fournisseurs','Factures et échéances'],['spay','Règlements fournisseurs','money-bill-transfer','Règlements fournisseurs','Historique des paiements']]],
['Flotte & Dépenses',[['fuel','Carburant & écarts','gas-pump','Carburant & écarts','Consommation par trajet et véhicule'],['expenses','Frais de route & péages','receipt','Frais de route & péages','Notes de frais chauffeurs'],['fleet','Maintenance & légal','car-burst','Maintenance & légal','Assurance, vignette, visite technique']]],
['Ressources Humaines',[['payroll','Paie & primes','users-gear','Paie & primes chauffeurs','Salaires, heures sup., bulletins']]],
['Comptabilité',[['journal','Journal PCGM','book-bookmark','Journal comptable (PCGM)','Écritures automatiques'],['tva','TVA & impôts','percent','TVA & impôts','Déclarations périodiques'],['treasury','Trésorerie','wallet','Trésorerie','Soldes banque et caisse'],['settings','Paramètres entreprise','building-gear','Paramètres entreprise','Informations légales']]]];
const TT={};NAV.forEach(g=>g[1].forEach(t=>TT[t[0]]=t));
function render(){const t=TT[cur],al=alerts().filter(a=>a[0]==='r').length;$('#nav').innerHTML=NAV.map(([g,it])=>`<p class="eb">${g}</p>`+it.map(([k,l,i])=>`<button class="nv ${k==cur?'on':''}" onclick="go2('${k}')"><i class="fa-solid fa-${i}"></i><span>${l}</span>${k=='dashboard'&&al?`<em>${al}</em>`:''}</button>`).join('')).join('');
 $('#lg').src=$('#lg2').src=LOGO;$('#pco').textContent=S.co.name;$('#pti').textContent=t[3];$('#pdt').textContent='Édité le '+fr(iso(TODAY));if(!document.querySelector('link[rel=icon]')){const l=document.createElement('link');l.rel='icon';l.href=LOGO;document.head.appendChild(l)}$('#kick').textContent=t[3];$('#ttl').textContent=t[4];$('#view').innerHTML=V[cur]();save()}
function go2(k){cur=k;render();scrollTo(0,0)}
function exportCur(){const T=(h,r)=>[h,...r];const a=agg();
 const X={invoices:()=>['invoices',T(['N° Facture','BL','Client','Date','Mode','HT','TVA','TTC','Échéance','Payé','Reste'],S.invs.map(i=>[i.no,i.bl,i.client,fr(i.date),MODES[i.mode],i.ht,i.tva,i.ttc,fr(i.due),paidOf(i),rest(i)]))],
 tva:()=>['declaration_tva',T(['Période','CA HT','TVA facturée','TVA récupérable','TVA à payer'],Object.keys(a).sort().map(k=>[k,r2(a[k].r),r2(a[k].tf),r2(a[k].tr),r2(a[k].tf-a[k].tr)]))],
 payroll:()=>['paie',T(['Employé','Base','Primes','HS','Fériés','Brut','CNSS','AMO','IR','Net'],S.emps.map(e=>{const p=payc(e);return [e.name,e.base,p.pr,p.ot,p.fe,p.gross,p.cnss,p.amo,p.ir,p.net]}))],
 fuel:()=>['carburant',T(['Date','Véhicule','Chauffeur','Trajet','Km','Litres','L/100km','Écart %'],S.fuel.map(f=>[fr(f.date),f.veh,f.driver,f.trip,f.km,f.l,avg(f).toFixed(1),gap(f).toFixed(1)]))],
 sdebt:()=>['dettes_fournisseurs',T(['Fournisseur','Réf','Catégorie','Date','Échéance','TTC','Reste'],S.sinv.map(s=>[s.sup,s.ref,CAT[s.cat][0],fr(s.date),fr(s.due),s.ttc,sRest(s)]))],
 dashboard:()=>['synthese_mensuelle',T(['Mois','Revenus','Dépenses','Résultat'],Object.keys(a).sort().map(k=>[k,r2(a[k].r),r2(a[k].c),r2(a[k].r-a[k].c)]))]};
 const x=(X[cur]||(()=>['journal_comptable',T(['Date','Journal','Pièce','Compte','Libellé','Débit','Crédit'],S.jr.flatMap(e=>e.lines.map(l=>[fr(e.date),e.j,e.ref,l[0]+' '+(ACC[l[0]]||''),e.label,l[1],l[2]])))]))();csv(x[0],x[1])}

/* ========== Formulaires & actions ========== */
const H={};
async function go(e,k){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),fl=e.target.querySelector('[type=file]');
 if(fl&&fl.files[0]){if(fl.files[0].size>7e5){toast('Image trop lourde (max 700 Ko) - enregistrée sans reçu.')}else f.img=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(fl.files[0])})}
 if(H[k](f)!==false){closeM();render()}return false}
const bq=[['Virement','Virement'],['Chèque','Chèque'],['Espèces','Espèces']];
function openConv(){const p=S.bls.filter(x=>!x.inv);if(!p.length)return toast('Aucun BL en attente de facturation.');
 modal(`<h3>Convertir un bon de livraison en facture</h3><form onsubmit="return go(event,'conv')">${sel('Bon de livraison','bl',p.map(x=>[x.id,`${x.id} · ${x.client} · ${x.trip}`]),p[0].id)}<div class="f2">${sel('Mode de calcul','mode',Object.entries(MODES),p[0].mode)}${sel('TVA','rate',[[14,'14 % transport'],[20,'20 %'],[10,'10 %'],[0,'Exonéré']],S.co.tva)}</div>${inp('Date de facture','date','date',iso(TODAY))}<div id="pv" class="al" style="background:#f1f5f9;border-color:#e2e8f0;color:#0f172a"></div><button class="bp">Générer la facture</button></form>`);
 const fm=$('#modal form'),u=()=>{const x=S.bls.find(y=>y.id==fm.elements.bl.value),k=calc(x,fm.elements.mode.value,+fm.elements.rate.value);$('#pv').innerHTML=`${x.t} t · ${x.km} km → HT <b>${M(k.ht)}</b> · TVA ${M(k.tva)} · <b>TTC ${M(k.ttc)}</b>`};
 fm.onchange=(e)=>{if(e.target.name==='bl')fm.elements.mode.value=S.bls.find(y=>y.id==fm.elements.bl.value).mode;u()};u()}
H.conv=f=>{const no=makeInv(f.bl,f.mode,+f.rate,f.date);toast('Facture '+no+' générée + écritures comptables créées');cur='invoices'};
function openBl(){modal(`<h3>Nouveau bon de livraison</h3><form onsubmit="return go(event,'bl')">${sel('Client','client',S.clients.map(c=>[c.name,c.name]))}${inp('Trajet','trip','text','Agadir → Casablanca','required')}<div class="f2">${inp('Poids (tonnes)','t','number','20','step=0.1')}${inp('Distance (km)','km','number','500')}</div>${sel('Mode de calcul','mode',Object.entries(MODES),'forfait')}<button class="bp">Enregistrer</button></form>`)}
H.bl=f=>{S.bls.push({id:'BL-'+(90150+ ++S.n.bl*7),date:iso(TODAY),client:f.client,trip:f.trip,t:+f.t,km:+f.km,mode:f.mode});toast('BL enregistré')};
function openPay(no){const i=S.invs.find(x=>x.no===no);modal(`<h3>Encaisser ${no} - ${i.client}</h3><p class="mut" style="margin-bottom:12px">Reste dû : <b>${M(rest(i))}</b></p><form onsubmit="return go(event,'pay')"><input type="hidden" name="no" value="${no}">${inp('Montant encaissé (MAD)','amt','number',rest(i),'step=0.01 required')}<div class="f2">${sel('Mode','mode',[...bq,['Effet','Effet de commerce']])}${inp('Date','date','date',iso(TODAY))}</div><button class="bp">Valider l’encaissement</button></form>`)}
H.pay=f=>{const i=S.invs.find(x=>x.no===f.no),a=Math.min(+f.amt,rest(i));if(!(a>0))return false;payInv(f.no,r2(a),f.mode,f.date);toast('Encaissement de '+M(a)+' enregistré')};
function viewInv(no){const i=S.invs.find(x=>x.no===no),c=S.co,bl=S.bls.find(x=>x.id===i.bl);
 modal(`<div class="doc"><div class="fx"><div class="fx" style="gap:12px;justify-content:flex-start"><img src="${LOGO}" class="dl"><div><h3>${c.name}</h3><p class="mut">${c.addr}<br>IF ${c.if} · TP ${c.tp} · ICE ${c.ice} · RC ${c.rc}</p></div></div><div style="text-align:right"><h3 style="color:#ea580c">FACTURE ${i.no}</h3><p class="mut">Date : ${fr(i.date)}<br>Échéance : ${fr(i.due)}</p></div></div><p style="margin:18px 0"><b>Client :</b> ${i.client}<br><b>Réf. BL :</b> ${i.bl}</p><table><thead><tr><th>Désignation</th><th>Base de calcul</th><th>Montant HT</th></tr></thead><tbody><tr><td>Transport ${bl?bl.trip:''}</td><td>${MODES[i.mode]}${i.mode=='poids'?' · '+bl.t+' t':i.mode=='distance'?' · '+bl.km+' km':''}</td><td>${M(i.ht)}</td></tr></tbody></table><div class="tot">Total HT : ${M(i.ht)}<br>TVA ${i.rate} % : ${M(i.tva)}<br><b style="font-size:15px">Total TTC : ${M(i.ttc)}</b><br>Déjà réglé : ${M(paidOf(i))} · Reste : <b>${M(rest(i))}</b></div></div><p class="noprint" style="margin-top:16px">${btn('<i class="fa-solid fa-print"></i> Imprimer / PDF','window.print()')}</p>`)}
function relance(cl){const L=S.invs.filter(i=>i.client===cl&&rest(i)>.004),tot=L.reduce((s,i)=>s+rest(i),0),ret=L.some(late);S.rel[cl]=(S.rel[cl]||0)+1;save();
 const txt=`Objet : ${ret?'Relance de paiement':'Relevé de compte'} - ${S.co.name}\n\nBonjour,\n\n${ret?'Sauf erreur de notre part, les factures suivantes sont échues':'Veuillez trouver votre relevé de compte'} :\n${L.map(i=>`- ${i.no} du ${fr(i.date)} · échéance ${fr(i.due)} · ${M(rest(i))}`).join('\n')}\n\nTotal dû : ${M(tot)}\n\nMerci de procéder au règlement dans les meilleurs délais.\n\nCordialement,\nService Comptabilité - ${S.co.name}`;
 modal(`<h3>${ret?'Relance n°'+S.rel[cl]:'Relevé'} - ${cl}</h3><textarea id="rt" rows="13">${txt}</textarea><p style="margin-top:12px">${btn('Ouvrir dans la messagerie',"location.href='mailto:?subject='+encodeURIComponent('Relance de paiement')+'&body='+encodeURIComponent($('#rt').value)")} ${btn('Copier le texte',"navigator.clipboard.writeText($('#rt').value);toast('Texte copié')",'bs')}</p>`);render()}
function openSinv(cat='carburant'){modal(`<h3>Facture fournisseur</h3><form onsubmit="return go(event,'sinv')"><div class="f2">${inp('Fournisseur','sup','text','','required')}${inp('Référence','ref','text','','required')}${sel('Catégorie','cat',Object.entries(CAT).map(([k,v])=>[k,v[0]]),cat)}${inp('Montant TTC (MAD)','ttc','number','','step=0.01 required')}${inp('Date','date','date',iso(TODAY))}${inp('Échéance','due','date',addD(30))}</div><p class="mut" style="margin-bottom:10px">TVA déduite automatiquement selon la catégorie (carburant 10 %, pièces 20 %, assurance/vignette exonérées).</p><button class="bp">Enregistrer</button></form>`)}
H.sinv=f=>{addSinv({sup:f.sup,ref:f.ref,cat:f.cat,date:f.date,ttc:+f.ttc,due:f.due,rate:CAT[f.cat][2]});toast('Facture fournisseur enregistrée')};
function openSpay(id){const s=S.sinv.find(x=>x.id==id);modal(`<h3>Régler ${s.sup} - ${s.ref}</h3><form onsubmit="return go(event,'spay')"><input type="hidden" name="id" value="${id}">${inp('Montant (MAD)','amt','number',sRest(s),'step=0.01')}<div class="f2">${sel('Mode','mode',bq)}${inp('Date','date','date',iso(TODAY))}</div>${inp('Banque / référence','ref','text','VIR-'+Math.floor(1000+Math.random()*9000))}<button class="bp">Valider le règlement</button></form>`)}
H.spay=f=>{const s=S.sinv.find(x=>x.id==f.id),a=Math.min(+f.amt,sRest(s));if(!(a>0))return false;paySinv(f.id,r2(a),f.mode,f.date,f.ref);toast('Règlement enregistré')};
function openFuel(){modal(`<h3>Saisie carburant</h3><form onsubmit="return go(event,'fuel')"><div class="f2">${sel('Véhicule','veh',S.veh.map(v=>[v.p,`${v.p} (${v.m})`]))}${inp('Chauffeur','driver','text','','required')}${inp('Trajet','trip','text','','required')}${inp('Fournisseur','sup','text','Afriquia Carburant')}${inp('Km parcourus','km','number','','required')}${inp('Litres','l','number','','step=0.1 required')}${inp('Prix / litre','pl','number','11.20','step=0.01')}${inp('Date','date','date',iso(TODAY))}</div><button class="bp">Enregistrer</button></form>`)}
H.fuel=f=>{addFuel({...f,km:+f.km,l:+f.l,pl:+f.pl});const x=S.fuel[S.fuel.length-1],g=gap(x);toast(g>10?`Surconsommation détectée : +${g.toFixed(1)} %`:'Plein enregistré (conforme)')};
function openExp(){modal(`<h3>Nouvelle dépense de route</h3><form onsubmit="return go(event,'exp')"><div class="f2">${inp('Chauffeur','driver','text','','required')}${inp('N° trajet','trip','text','TRJ-','required')}${sel('Type','type',['Péage','Repas','Nuitée','Autre'].map(x=>[x,x]))}${inp('Montant (MAD)','amt','number','','step=0.01 required')}${inp('Date','date','date',iso(TODAY))}${inp('Photo du ticket','f','file','','accept="image/*"')}</div><button class="bp">Enregistrer</button></form>`)}
H.exp=f=>{S.exp.push({id:++S.n.ex,date:f.date,driver:f.driver,trip:f.trip,type:f.type,amt:+f.amt,img:f.img,st:'wa'});toast('Dépense ajoutée')};
function expSt(id,st){const e=S.exp.find(x=>x.id==id);e.st=st;if(st==='ok')post(e.date,'CA','NF-'+id,`Frais de route ${e.type} - ${e.trip}`,[['6143',e.amt,0],['5161',0,e.amt]]);toast(st==='ok'?'Frais validés et comptabilisés':'Reçu rejeté');render()}
const viewImg=id=>modal(`<h3>Reçu</h3><img src="${S.exp.find(x=>x.id==id).img}" style="max-width:100%;border-radius:8px">`);
function openDoc(){modal(`<h3>Nouvelle échéance</h3><form onsubmit="return go(event,'doc')"><div class="f2">${sel('Véhicule','p',S.veh.map(v=>[v.p,v.p]))}${sel('Type','type',['Assurance','Vignette','Visite technique','Vidange'].map(x=>[x,x]))}${inp('Échéance','due','date',addD(365))}${inp('Coût estimé','cost','number','0')}</div><button class="bp">Ajouter</button></form>`)}
H.doc=f=>{S.docs.push({id:++S.n.doc,p:f.p,type:f.type,last:iso(TODAY),due:f.due,cost:+f.cost})};
function openRenew(id){const d=S.docs.find(x=>x.id==id);modal(`<h3>Renouveler ${d.type} - ${d.p}</h3><form onsubmit="return go(event,'renew')"><input type="hidden" name="id" value="${id}">${inp('Coût (MAD)','cost','number',d.cost,'step=0.01')}${inp('Nouvelle échéance','due','date',addD(365,new Date(Math.max(new Date(d.due),TODAY))))}<button class="bp">Renouveler & comptabiliser</button></form>`)}
H.renew=f=>{const d=S.docs.find(x=>x.id==f.id),c=+f.cost,acc=d.type=='Assurance'?'6134':d.type=='Vignette'?'6167':'6133';d.last=iso(TODAY);d.due=f.due;d.cost=c;if(c>0)post(iso(TODAY),'BQ','REN-'+d.id,`${d.type} ${d.p}`,[[acc,c,0],['5141',0,c]]);toast('Échéance renouvelée')};
function openEmp(id){const e=S.emps.find(x=>x.id==id)||{name:'',role:'Chauffeur poids lourd',base:4500,kids:0,trips:0,nights:0,ot:0,fer:0};modal(`<h3>${id?'Variables du mois - '+e.name:'Nouvel employé'}</h3><form onsubmit="return go(event,'emp')"><input type="hidden" name="id" value="${id||''}"><div class="f2">${inp('Nom','name','text',e.name,'required')}${inp('Poste','role','text',e.role)}${inp('Salaire de base','base','number',e.base)}${inp('Personnes à charge','kids','number',e.kids)}${inp('Trajets longue distance','trips','number',e.trips)}${inp('Nuitées (découcher)','nights','number',e.nights)}${inp('Heures supplémentaires','ot','number',e.ot)}${inp('Jours fériés travaillés','fer','number',e.fer)}</div><button class="bp">Enregistrer</button></form>`)}
H.emp=f=>{const o={name:f.name,role:f.role,base:+f.base,kids:+f.kids,trips:+f.trips,nights:+f.nights,ot:+f.ot,fer:+f.fer};if(f.id)Object.assign(S.emps.find(x=>x.id==f.id),o);else S.emps.push({id:++S.n.emp,...o})};
function valPay(mk){if(runPay(mk)){toast('Paie '+mk+' comptabilisée (journal PA)');render()}else toast('Cette période est déjà comptabilisée.')}
function bulletin(id){const e=S.emps.find(x=>x.id==id),p=payc(e),c=S.co,mk=S.pm||MK,L=(a,b)=>`<tr><td>${a}</td><td style="text-align:right">${b}</td></tr>`;
 modal(`<div class="doc"><div class="fx"><div class="fx" style="gap:12px;justify-content:flex-start"><img src="${LOGO}" class="dl"><div><h3>${c.name}</h3><p class="mut">${c.addr}<br>ICE ${c.ice}</p></div></div><h3 style="color:#ea580c">BULLETIN DE PAIE<br><span class="mut">${mk.slice(5)}/${mk.slice(0,4)}</span></h3></div><p style="margin:16px 0"><b>${e.name}</b> - ${e.role}<br>Personnes à charge : ${e.kids}</p><table><tbody>${L('Salaire de base',M(e.base))}${L('Heures supplémentaires ('+e.ot+' h × 125 %)',M(p.ot))}${L('Primes trajets ('+e.trips+') & découcher ('+e.nights+')',M(p.pr))}${L('Jours fériés travaillés ('+e.fer+')',M(p.fe))}${L('<b>Salaire brut</b>','<b>'+M(p.gross)+'</b>')}${L('CNSS (4,48 %, plafond 6 000)','- '+M(p.cnss))}${L('AMO (2,26 %)','- '+M(p.amo))}${L('Impôt sur le revenu (IR)','- '+M(p.ir))}${L('<b style="font-size:14px">NET À PAYER</b>','<b style="font-size:14px;color:#059669">'+M(p.net)+'</b>')}</tbody></table></div><p class="noprint" style="margin-top:16px">${btn('<i class="fa-solid fa-print"></i> Imprimer / PDF','window.print()')}</p>`)}
H.co=f=>{Object.assign(S.co,{name:f.name,addr:f.addr,if:f.if,tp:f.tp,ice:f.ice,rc:f.rc,tva:+f.tva});toast('Paramètres enregistrés')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
render();
</script>
</body>
