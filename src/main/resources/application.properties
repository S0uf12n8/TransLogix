spring.application.name=translogix

# Database connection (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/translogix_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:translogix_user}
spring.datasource.password=${DB_PASSWORD:translogix_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true