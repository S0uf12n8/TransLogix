services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: transivo
      POSTGRES_USER: transivo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-transivo_dev}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transivo"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
