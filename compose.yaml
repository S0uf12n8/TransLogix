services:
  db:
    image: mysql:8.0
    container_name: translogix-db
    restart: always
    environment:
      MYSQL_DATABASE: translogix_db
      MYSQL_USER: translogix_user
      MYSQL_PASSWORD: translogix_pass
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: